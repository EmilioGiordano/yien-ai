[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
yien-proto = { path = "crates/yien-proto" }
yien-layout = { path = "crates/yien-layout" }
yien-input = { path = "crates/yien-input" }
yien-pty = { path = "crates/yien-pty" }
yien-testkit = { path = "crates/yien-testkit" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
anyhow = "1.0.104"
portable-pty = "0.9.0"
thiserror = "2.0.21"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
