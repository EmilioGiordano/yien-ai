[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
yien-proto = { path = "crates/yien-proto" }
yien-layout = { path = "crates/yien-layout" }
yien-input = { path = "crates/yien-input" }
yien-pty = { path = "crates/yien-pty" }
yien-testkit = { path = "crates/yien-testkit" }
yien-vt = { path = "crates/yien-vt" }
yien-ui = { path = "crates/yien-ui" }
yien-agent = { path = "crates/yien-agent" }
yien-core = { path = "crates/yien-core" }
yien-session = { path = "crates/yien-session" }
yien-config = { path = "crates/yien-config" }
yien-platform = { path = "crates/yien-platform" }
yien-git = { path = "crates/yien-git" }
yien-which = { path = "crates/yien-which" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
anyhow = "1.0.104"
thiserror = "2.0.21"
alacritty_terminal = { version = "0.26.0", default-features = false }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
gpui-kit = "=0.7.1"
portable-pty = "0.9.0"
regex = "1.13.1"
tokio = { version = "1.54.1", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "env-filter", "tracing-log"] }
tracing-appender = "0.2.5"
dirs = "6.0.0"
ignore = "0.4.34"
getrandom = "0.4.3"
windows-sys = "0.61.2"
windows = "0.62.2"
raw-window-handle = "0.6.2"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
todo = "deny"
dbg_macro = "deny"

[profile.release]
strip = "symbols"
