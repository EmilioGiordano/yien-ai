# cargo-deny configuration (ADR-18). Run with `cargo deny check`.

[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
all-features = true

[advisories]
# Unmaintained crates pulled in by gpui-kit =0.7.1 (ADR-02), none a direct
# dependency of ours and none with a fix to upgrade to. Revisit on each gpui-kit bump.
ignore = [
    { id = "RUSTSEC-2024-0384", reason = "instant, via gpui-kit" },
    { id = "RUSTSEC-2024-0436", reason = "paste, via gpui-kit" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz, via gpui-kit" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser, via gpui-kit" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant, via gpui-kit (Linux)" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names, via gpui-kit (Linux)" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive, via gpui-kit (Linux)" },
]

[licenses]
# YIEN is GPL-3.0-or-later. The allow list stays the permissive list, all
# compatible with GPLv3; anything not listed is rejected. Adding a dependency
# under another licence is a deliberate decision, made here.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    "bzip2-1.0.6",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"
exceptions = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
