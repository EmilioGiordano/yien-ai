[package]
name = "yien-platform"
description = "The YIEN OS layer: per-user paths, logging, the hook pipe and the session file store; later notifications, tray and IPC."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
yien-proto = { workspace = true }
yien-agent = { workspace = true }
yien-session = { workspace = true }
getrandom = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
dirs = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
windows = { workspace = true, features = [
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
