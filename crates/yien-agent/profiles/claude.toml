schema = 1
id = "claude"
name = "Claude Code"
detect = { command = "claude", version_args = ["--version"], version_regex = '(\d+\.\d+\.\d+)' }

[launch]
args = ["--session-id", "{new_uuid}", "--settings", "{hooks_settings_file}"]
resume = ["--resume", "{session_id}", "--settings", "{hooks_settings_file}"]
session_id = "preassigned"
sessions = "claude-projects"
env = { YIEN_PANE = "{pane_id}", YIEN_HOOK_TOKEN = "{hook_token}", YIEN_HOOK_PIPE = "{hook_pipe}" }

[[rules]]
versions = ">=2.1.295, <3"
sources = ["hooks", "osc7501", "screen"]
hooks = "claude-command-v1"

[[rules.screen]]
confirms = "needs_you"
bottom_rows = 12
pattern = '(?m)^\s*Do you want to proceed\?'

# Startup screens: they come before the REPL, so no hook fires and no OSC
# 7501 is sent while they wait. Text read from the 2.1.325 binary.

# Folder trust, with its two choices in either order.
[[rules.screen]]
confirms = "needs_you"
bottom_rows = 12
pattern = '(?ms)^\W*Yes, I trust this folder\W*$.*^\W*No, (?:exit|continue without these permissions)\W*$|^\W*No, (?:exit|continue without these permissions)\W*$.*^\W*Yes, I trust this folder\W*$'

# First run: the theme picker, its title above the list and the preview.
[[rules.screen]]
confirms = "needs_you"
bottom_rows = 40
pattern = '(?m)^\W*Choose the text style that looks best with your terminal\W*$'

# Sign-in.
[[rules.screen]]
confirms = "needs_you"
bottom_rows = 16
pattern = '(?m)^\W*Select login method:\W*$'

[[rules.screen]]
confirms = "needs_you"
bottom_rows = 8
pattern = '(?m)^\W*Paste code here if prompted >'

[[rules.screen]]
confirms = "needs_you"
bottom_rows = 12
pattern = '(?s)Detected a custom API key in your environment.*Do you want to use this API key\?'

# The last first-run steps.
[[rules.screen]]
confirms = "needs_you"
bottom_rows = 16
pattern = '(?ms)^\W*Security notes:\W*$.*Claude can make mistakes\.'

[[rules.screen]]
confirms = "needs_you"
bottom_rows = 16
pattern = '''(?m)^\W*Use Claude Code's terminal setup\?\W*$'''

# Claude 2.1.326 stops sending state=idle when the user interrupts a turn
# mid-stream; the interrupt line it draws is the only thing told about it.
# Ends the turn as idle, never needs you (RN-02). Claude draws the line
# starting with its branch glyph ⎿, so the row-start anchor keeps a file
# or a reply printing the phrase mid-line from matching.
[[rules.screen]]
confirms = "interrupt"
bottom_rows = 60
pattern = '(?m)^\s*⎿\s+Interrupted · What should Claude do instead\?'

[[rules]]
versions = ">=2.0, <2.1.295"
sources = ["hooks", "screen"]
hooks = "claude-command-v1"

[[rules.screen]]
confirms = "needs_you"
bottom_rows = 12
pattern = '(?m)^\s*Do you want to proceed\?'
