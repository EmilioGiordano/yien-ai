schema = 1
id = "codex"
name = "Codex"
detect = { command = "codex", version_args = ["--version"], version_regex = '(\d+\.\d+\.\d+)' }

[launch]
resume = ["resume", "{session_id}"]
session_id = "from_list"
# Read nothing yet: the reader is a stub until the format is verified (S7).
sessions = "codex-sessions"

# OSC 7501 since 0.163.0; run against 0.167.2. Its `idle` after `working` is
# an interrupt or startup, never the end of a turn: Codex sends `done`.
[[rules]]
versions = ">=0.163, <1"
sources = ["osc7501"]

# Older versions: OSC 9 alone never lights the red mark.
[[rules]]
sources = ["osc9"]
